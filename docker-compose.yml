services:
  banco:
    image: postgres:16-alpine
    container_name: cantina-banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOME}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_SENHA}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados-cantina:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO} -d ${DB_NOME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cantina-api
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${DB_NOME}
      DB_USUARIO: ${DB_USUARIO}
      DB_SENHA: ${DB_SENHA}
      JWT_SEGREDO: ${JWT_SEGREDO}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      CORS_ORIGENS: ${CORS_ORIGENS}
      SWAGGER_ATIVO: ${SWAGGER_ATIVO}
    ports:
      - "8080:8080"

volumes:
  dados-cantina:
