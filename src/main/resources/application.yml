spring:
  application:
    name: cantina-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

server:
  port: ${PORTA:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ATIVO:true}
    operations-sorter: method
    tags-sorter: alpha

cantina:
  fuso-horario: America/Sao_Paulo
  jwt:
    segredo: ${JWT_SEGREDO}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
    emissor: cantina-api
  login:
    maximo-tentativas: 5
    bloqueio-minutos: 15
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:3000,http://localhost:5173}
